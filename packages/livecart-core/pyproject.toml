[project]
name = "livecart-core"
version = "0.1.0"
description = "LiveCart domain model, application use cases and infrastructure adapters."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
