[project]
name = "livecart-core"
version = "0.1.0"
description = "LiveCart domain model, application use cases and infrastructure adapters."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "httpx2==2.13.1",
    "prometheus-client==0.26.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.0.54",
    "stripe==15.6.1",
    "structlog==26.1.0",
    "uuid-utils==1.0.0",
]

[project.scripts]
livecart-healthcheck = "livecart_core.healthcheck:main"
livecart-migrate = "livecart_core.migrate:main"
livecart-seed = "livecart_core.seed:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
