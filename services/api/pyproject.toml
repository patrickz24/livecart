[project]
name = "livecart-api"
version = "0.1.0"
description = "LiveCart HTTP API: webhooks, REST and server-sent events."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asgi-correlation-id==5.0.1",
    "fastapi==0.141.1",
    "livecart-core",
    "pyjwt==2.15.0",
    "starlette==1.7.0",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
livecart-create-seller = "livecart_api.cli.create_seller:main"

[tool.uv.sources]
livecart-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
