# LiveCart local stack, limited to what exists so far: PostgreSQL and Redis,
# the one-shot migrate and seed jobs, then the API, the worker, the comment
# simulator and the web container.
#
#   cp .env.example .env      # once: secrets have no default here
#   docker compose up --build
#
# Published ports: web on 8080 on every interface (a phone on the LAN reaches
# the dashboard and the API through nginx), the API on 127.0.0.1:8000 only, and
# PostgreSQL and Redis on 127.0.0.1 with non-standard ports for the host-run
# tests (PG_HOST_PORT and REDIS_HOST_PORT in .env).

name: livecart

# Shared by api, worker, simulator, migrate and seed: one image, several commands.
x-python-service: &python-service
  image: livecart-python:local
  build:
    context: .
    dockerfile: infra/docker/python.Dockerfile
  # Non-root user (image), read-only root filesystem with a small /tmp for the
  # heartbeat file and tempfile, no capabilities, no privilege escalation.
  read_only: true
  tmpfs:
    - /tmp:size=16m,noexec,nosuid,nodev
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 512M
  restart: unless-stopped

# Runtime settings of the API and the worker. They connect as livecart_app, the
# least-privileged role; only migrate receives the migrator credentials.
x-runtime-environment: &runtime-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://livecart_app:${LIVECART_APP_PASSWORD:?set it in .env (cp .env.example .env)}@postgres:5432/livecart
  REDIS_URL: redis://:${REDIS_PASSWORD:?set it in .env (cp .env.example .env)}@redis:6379/0
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-livecart}
  JWT_SECRET: ${JWT_SECRET:?set it in .env (cp .env.example .env)}
  ORDER_TOKEN_KEY: ${ORDER_TOKEN_KEY:?set it in .env (cp .env.example .env)}
  MAX_QUANTITY_PER_COMMENT: ${MAX_QUANTITY_PER_COMMENT:-10}
  RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-900}
  DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
  # The hosted checkout (.env.example): the API and the worker build the same
  # provider, and the mock's sessions live in the shared Redis.
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
  MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:?set it in .env (cp .env.example .env)}
  # Stripe's test key and webhook signing secret: empty unless PAYMENT_PROVIDER=stripe.
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
  PAYMENT_GRACE_SECONDS: ${PAYMENT_GRACE_SECONDS:-600}
  PAYMENT_MAX_ATTEMPTS: ${PAYMENT_MAX_ATTEMPTS:-3}
  # HTTP perimeter of the API (.env.example).
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
  HSTS_ENABLED: ${HSTS_ENABLED:-false}
  # Rate limits of the API (.env.example); the defaults are the code's.
  RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
  RATE_LIMIT_LOGIN_FAILURES: ${RATE_LIMIT_LOGIN_FAILURES:-5}
  RATE_LIMIT_LOGIN_FAILURE_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_FAILURE_WINDOW_SECONDS:-900}
  RATE_LIMIT_SELLER_PER_MINUTE: ${RATE_LIMIT_SELLER_PER_MINUTE:-300}
  RATE_LIMIT_BUYER_LOOKUP_PER_MINUTE: ${RATE_LIMIT_BUYER_LOOKUP_PER_MINUTE:-30}
  RATE_LIMIT_BUYER_LOOKUP_NOT_FOUND_PER_MINUTE: ${RATE_LIMIT_BUYER_LOOKUP_NOT_FOUND_PER_MINUTE:-20}
  BUYER_LOOKUP_NOT_FOUND_ALERT_PER_MINUTE: ${BUYER_LOOKUP_NOT_FOUND_ALERT_PER_MINUTE:-100}
  RATE_LIMIT_BUYER_TOKEN_PER_MINUTE: ${RATE_LIMIT_BUYER_TOKEN_PER_MINUTE:-60}
  RATE_LIMIT_CHECKOUT_PER_MINUTE: ${RATE_LIMIT_CHECKOUT_PER_MINUTE:-5}
  RATE_LIMIT_STOREFRONT_PER_MINUTE: ${RATE_LIMIT_STOREFRONT_PER_MINUTE:-120}
  RATE_LIMIT_COMMENT_WEBHOOK_PER_MINUTE: ${RATE_LIMIT_COMMENT_WEBHOOK_PER_MINUTE:-6000}
  RATE_LIMIT_COMMENT_WEBHOOK_SIGNATURE_FAILURES_PER_MINUTE: ${RATE_LIMIT_COMMENT_WEBHOOK_SIGNATURE_FAILURES_PER_MINUTE:-60}
  RATE_LIMIT_PAYMENT_WEBHOOK_SIGNATURE_FAILURES_PER_MINUTE: ${RATE_LIMIT_PAYMENT_WEBHOOK_SIGNATURE_FAILURES_PER_MINUTE:-60}

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (cp .env.example .env)}
      # Read by infra/postgres/init-roles.sh on the first start only.
      LIVECART_MIGRATOR_PASSWORD: ${LIVECART_MIGRATOR_PASSWORD:?set it in .env (cp .env.example .env)}
      LIVECART_APP_PASSWORD: ${LIVECART_APP_PASSWORD:?set it in .env (cp .env.example .env)}
      LIVECART_SQL_DIR: /opt/livecart/postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The SQL files stay outside /docker-entrypoint-initdb.d, which would run
      # them on their own: only the script goes there, and it reads them.
      - ./infra/postgres:/opt/livecart/postgres:ro
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-55432}:5432"
    healthcheck:
      # Over TCP on purpose: while the init scripts run, the entrypoint's
      # temporary server listens on the Unix socket only.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=livecart"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s
    # The official entrypoint drops to the postgres user; read_only and
    # cap_drop would break its initial chown, so only resources are limited.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:8.10.2-alpine}
    # The entrypoint drops to the redis user when the command is redis-server.
    # Append-only file flushed every second; bounded memory that refuses writes
    # rather than evicting queue entries. The API receives the same maxmemory
    # (256 MiB by default) and checks at startup that a full comment queue
    # takes at most half of it.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set it in .env (cp .env.example .env)}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY_BYTES:-268435456}
      - --maxmemory-policy
      - noeviction
    environment:
      # Lets the healthcheck's redis-cli authenticate without -a on its command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set it in .env (cp .env.example .env)}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  # Applies the Alembic migrations (upgrade head) as livecart_migrator, then exits.
  migrate:
    <<: *python-service
    command: ["livecart-migrate", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MIGRATOR_URL: postgresql+asyncpg://livecart_migrator:${LIVECART_MIGRATOR_PASSWORD:?set it in .env (cp .env.example .env)}@postgres:5432/livecart
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Loads the demo data as livecart_migrator (the reset of the load test session
  # deletes rows), creating only what is missing, then exits. `make seed` runs it
  # again; `docker compose run --rm seed --reset-loadtest` empties the load test.
  # The worker waits for it (service_completed_successfully), which also tells
  # `up --wait` that seed is a job expected to exit: without a dependant, --wait
  # takes its exit for a failure. The API does not wait for it, so a seed that
  # cannot finish never keeps the API down.
  seed:
    <<: *python-service
    # An entrypoint rather than a command, so that the arguments of
    # `docker compose run --rm seed ...` are passed to livecart-seed.
    entrypoint: ["livecart-seed"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MIGRATOR_URL: postgresql+asyncpg://livecart_migrator:${LIVECART_MIGRATOR_PASSWORD:?set it in .env (cp .env.example .env)}@postgres:5432/livecart
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?set it in .env (cp .env.example .env)}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *python-service
    # uvicorn trusts X-Forwarded-For and X-Forwarded-Proto from nginx only.
    command:
      - uvicorn
      - livecart_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - ${NGINX_IP:-172.30.0.10}
    environment:
      <<: *runtime-environment
      # Only the API checks the comment webhooks: the worker never receives their keys.
      ENABLED_PLATFORMS: ${ENABLED_PLATFORMS:-simulator}
      COMMENT_WEBHOOK_SECRET_SIMULATOR: ${COMMENT_WEBHOOK_SECRET_SIMULATOR:?set it in .env (cp .env.example .env)}
      # Backpressure of the webhook, checked against Redis's own maxmemory above.
      QUEUE_MAX_DEPTH: ${QUEUE_MAX_DEPTH:-20000}
      QUEUE_MAX_ENVELOPE_BYTES: ${QUEUE_MAX_ENVELOPE_BYTES:-5120}
      REDIS_MAXMEMORY_BYTES: ${REDIS_MAXMEMORY_BYTES:-268435456}
      # Streams of session events (SSE) served at once; the next one gets 503.
      SSE_MAX_STREAMS: ${SSE_MAX_STREAMS:-200}
      # And of one seller at once on this instance; its next one gets 429.
      SSE_MAX_STREAMS_PER_SELLER: ${SSE_MAX_STREAMS_PER_SELLER:-5}
      # The links of the buyer apps a checkout sends the buyer back to (.env.example).
      ALLOWED_APP_SCHEMES: ${ALLOWED_APP_SCHEMES:-livecart,samplelive}
      # The mock's hosted page posts its webhook to the API itself, on its loopback.
      MOCK_PAYMENT_WEBHOOK_URL: ${MOCK_PAYMENT_WEBHOOK_URL:-http://127.0.0.1:8000/api/v1/webhooks/payments/mock}
    ports:
      - "127.0.0.1:8000:8000" # loopback only: other clients go through nginx
    # The Prometheus endpoint (METRICS_PORT, 9100), for a scraper on the compose
    # network only: never published on the host, never routed by nginx.
    expose:
      - "9100"
    healthcheck:
      # Readiness (PostgreSQL and Redis reachable), so that `up --wait` and the
      # web container wait for a usable API. The image default is /health.
      test: ["CMD", "livecart-healthcheck", "http", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Stateless: `docker compose up --scale worker=3` runs three consumers.
  worker:
    <<: *python-service
    command: ["livecart-worker"]
    environment:
      <<: *runtime-environment
      # Comment handlers, window and deadline (.env.example); the pool of
      # WORKER_CONCURRENCY + 6 connections must fit WORKER_DB_MAX_CONNECTIONS.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-16}
      WORKER_BATCH: ${WORKER_BATCH:-32}
      MESSAGE_PROCESS_TIMEOUT_S: ${MESSAGE_PROCESS_TIMEOUT_S:-30}
      WORKER_DB_MAX_CONNECTIONS: ${WORKER_DB_MAX_CONNECTIONS:-22}
      # Reclaim and dead letters; an empty idle time is derived from the window.
      QUEUE_MAX_DELIVERIES: ${QUEUE_MAX_DELIVERIES:-3}
      QUEUE_RECLAIM_MIN_IDLE_MS: ${QUEUE_RECLAIM_MIN_IDLE_MS:-}
      # The scheme of the links the buyers receive on the development stream.
      BUYER_LINK_SCHEME: ${BUYER_LINK_SCHEME:-livecart}
      # The optional LLM fallback (.env.example): without a key, the parser alone.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5}
      # Without a colon: an empty LLM_EFFORT stays empty, and sends no effort.
      LLM_EFFORT: ${LLM_EFFORT-low}
      LLM_REFUSAL_FALLBACK: ${LLM_REFUSAL_FALLBACK:-true}
      LLM_CALL_TIMEOUT_S: ${LLM_CALL_TIMEOUT_S:-8}
      DB_BUDGET_S: ${DB_BUDGET_S:-5}
      # Its cost guard and its slot wait; LLM_PRICES, when set, replaces the price table.
      LLM_MAX_CALLS_PER_SESSION: ${LLM_MAX_CALLS_PER_SESSION:-200}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-1.00}
      LLM_SLOT_WAIT_S: ${LLM_SLOT_WAIT_S:-7}
      LLM_PRICES: ${LLM_PRICES:-}
    # The Prometheus endpoint (METRICS_PORT, 9100): the compose network only.
    expose:
      - "9100"
    # On SIGTERM the worker stops reading, lets the handlers that started
    # finish, each within MESSAGE_PROCESS_TIMEOUT_S (30 s), and leaves the
    # deliveries still waiting for a handler pending for a reclaim: a stop
    # takes one deadline at most, whatever WORKER_BATCH, and 40 s leaves the
    # time to close the pools; raise it with MESSAGE_PROCESS_TIMEOUT_S. Docker's
    # default 10 s would kill handlers midway, and only leave their deliveries
    # for a reclaim.
    stop_grace_period: 40s
    healthcheck:
      # The heartbeat file in /tmp, touched every 10 s while Redis answers PING.
      test: ["CMD", "livecart-healthcheck", "heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    depends_on:
      migrate:
        condition: service_completed_successfully
      # The worker consumes the comments of the seeded demo sessions; see seed.
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # A live audience on the seeded friday-drop session: signed comments at a
  # gentle rate (one every 5 s on average), so that `docker compose up` shows
  # intents, orders and stock moving without any third-party key. `docker
  # compose stop simulator` pauses it; `docker compose run --rm simulator
  # --text` prints the messages the buyers received (references, tokens and
  # links). The simulator refuses to run with APP_ENV=production.
  simulator:
    <<: *python-service
    # An entrypoint, so that `docker compose run --rm simulator --text` passes
    # its arguments to livecart-simulate.
    entrypoint: ["livecart-simulate"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Straight to the API container, as a platform's webhook would come in.
      SIMULATOR_API_URL: http://api:8000
      SIMULATOR_RATE: ${SIMULATOR_RATE:-0.2}
      SIMULATOR_EXCLUDE_CODES: ${SIMULATOR_EXCLUDE_CODES:-}
      SIMULATOR_BUYERS: ${SIMULATOR_BUYERS:-12}
      COMMENT_WEBHOOK_SECRET_SIMULATOR: ${COMMENT_WEBHOOK_SECRET_SIMULATOR:?set it in .env (cp .env.example .env)}
      # The text mode's stream of the buyers' messages, which the worker writes.
      REDIS_URL: redis://:${REDIS_PASSWORD:?set it in .env (cp .env.example .env)}@redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-livecart}
    # No HTTP server to probe: the image's API healthcheck does not apply, and
    # `up --wait` waits for the container to run.
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
      # The session it comments on.
      seed:
        condition: service_completed_successfully

  web:
    image: livecart-web:local
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    # nginx-unprivileged runs as uid 101; its pid file and temp paths are in /tmp.
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid,nodev
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      default:
        # The address uvicorn trusts (--forwarded-allow-ips above).
        ipv4_address: ${NGINX_IP:-172.30.0.10}
    ports:
      - "8080:8080" # every interface: reachable from a phone on the LAN (Expo Go)
    # Healthcheck: the image's (GET /healthz).
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Stripe's CLI, in the stripe profile only: the default stack takes payments
  # with the mock and needs no key. With PAYMENT_PROVIDER=stripe and the test
  # keys of your own Stripe account in .env (CONTRIBUTING.md, "Payments"),
  # `docker compose --profile stripe up -d` forwards the checkout.session
  # events of that test account to the payment webhook, through nginx, as a
  # provider's call comes in. The CLI shares the network namespace of the web
  # container, so that it reaches nginx on localhost:8080, a host the API
  # trusts (ALLOWED_HOSTS); its log prints the signing secret (whsec_...) that
  # STRIPE_WEBHOOK_SECRET must hold.
  stripe-cli:
    image: stripe/stripe-cli:v1.52.0
    profiles: [stripe]
    command:
      - listen
      - --forward-to
      - http://localhost:8080/api/v1/webhooks/payments/stripe
      - --events
      - checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired
    environment:
      # Read by the CLI. Empty unless set in .env, and the CLI then refuses to
      # listen: no default, and never a ${VAR:?}, which would stop every
      # `docker compose` command of the default stack too.
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    network_mode: "service:web"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    depends_on:
      web:
        condition: service_healthy
    # A missing or refused key ends the CLI: no restart loop.
    restart: "no"

networks:
  default:
    # A fixed subnet, so that nginx keeps a fixed address (NGINX_IP). The other
    # containers get dynamic addresses from the upper half only (ip_range), so
    # scaled workers can never take NGINX_IP before web starts.
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.30.0.0/24}
          ip_range: ${COMPOSE_IP_RANGE:-172.30.0.128/25}

volumes:
  postgres-data:
  redis-data:
