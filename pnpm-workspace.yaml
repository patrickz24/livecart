# JS workspace members, listed explicitly because packages/ also holds a uv
# member.
packages:
  - apps/mobile
  - apps/web
  - packages/api-client
  - packages/design-tokens

# pnpm blocks dependency build scripts unless they are reviewed here, and
# fails the install on an unreviewed one (strictDepBuilds).
allowBuilds:
  # Denied: its postinstall (`lefthook install`) does not run again once the
  # pnpm store has cached its result, so a second clone got no git hook. The
  # root "prepare" script (scripts/install-git-hooks.mjs) installs them instead.
  lefthook: false

auditConfig:
  ignoreGhsas:
    # node-forge <= 1.4.0, HIGH, no fixed release yet: RSA PKCS#1 v1.5
    # signature verification. Only Expo's CLI loads it (@expo/cli and its
    # @expo/code-signing-certificates), on the developer's machine, to sign
    # iOS builds and expo-updates manifests, which the app does not use;
    # nothing of it reaches the app's bundle. `expo` lists the CLI as a
    # dependency, hence a production path for `pnpm audit --prod`. Trivy
    # skips it as unfixed. Remove this entry once node-forge ships a fix.
    - GHSA-86w9-cpqp-85rv

overrides:
  # @hey-api/json-schema-ref-parser pins js-yaml 4.2.0, which has three HIGH
  # CPU-exhaustion advisories on crafted YAML (fixed in 4.3.2, same major).
  # The generator only reads our own openapi.json, but a fixable HIGH must not
  # stay in the lockfile. Drop this once Hey API ships js-yaml >= 4.3.2.
  "@hey-api/json-schema-ref-parser>js-yaml": 4.3.2
