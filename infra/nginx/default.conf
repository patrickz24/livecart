# nginx of the web container: serves the built dashboard and forwards the API
# on the same origin, so browsers make no cross-origin call (no CORS) and
# SameSite=Strict cookies work. Mobile clients use this entry point too: the
# API itself is only published on 127.0.0.1.
#
# Static on purpose (no envsubst template): the reviewed file is the file that
# runs.

# The api service, looked up again in Docker's embedded DNS every 10 s rather
# than once at startup: a recreated api container (`docker compose up -d
# --build api`) may get another address, and nginx would otherwise keep
# sending requests to the old one (502) until web restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Request bodies are capped at 1 MiB before they reach the API.
    client_max_body_size 1m;

    # nginx is the only trusted hop. X-Forwarded-For is overwritten with the
    # peer address, never appended to, so a client cannot forge its IP; uvicorn
    # trusts these headers from this container's fixed address only
    # (--forwarded-allow-ips). Inherited by every proxied location below.
    # Host is the client's header as sent, port included ($http_host, not
    # $host, which drops it): URLs the API builds from it, such as the 307 of
    # a trailing-slash redirect, must keep :8080.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Container healthcheck, answered by nginx itself without the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The versioned API surface.
    location /api/ {
        proxy_pass http://api;
    }

    # The stream of a session's events (SSE), which the dashboard reads with
    # fetch: each message is relayed the moment it arrives, never buffered,
    # cached or compressed, whatever the upstream sends. The API answers it
    # with X-Accel-Buffering: no as well; this location no longer depends on
    # that header surviving every hop. A regex location wins over the /api/
    # prefix. The API comments every 15 s, well within proxy_read_timeout
    # (60 s), so an idle stream stays open; the dashboard gives up on one
    # silent for 45 s and reconnects with Last-Event-ID.
    location ~ ^/api/v1/live-sessions/[^/]+/events$ {
        proxy_pass http://api;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 60s;
    }

    # API liveness, read by the compose smoke test (the Vite dev server
    # proxies the same path). /ready stays internal.
    location = /health {
        proxy_pass http://api;
    }

    # Single-page app: unknown paths fall back to index.html, where the
    # client-side router takes over. Its security headers are set here, not
    # for the whole server: the proxied API answers carry the API's own, a
    # stricter CSP among them, and would otherwise get both. "always" adds
    # them to error responses as well.
    location / {
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
