# Virtual uv workspace root: not a package itself. It groups the Python
# members under a single uv.lock and holds the shared tool configuration.

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.uv]
required-version = ">=0.12.19,<0.13"

[tool.uv.workspace]
members = [
    "packages/livecart-core",
    "services/api",
    "services/worker",
    "services/simulator",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "S",     # flake8-bandit: security (includes S608, SQL built from strings)
    "ASYNC", # flake8-async: blocking calls inside coroutines
    "DTZ",   # flake8-datetimez: naive datetimes (timestamps are UTC-aware)
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "PT",    # flake8-pytest-style
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Tests assert and use obviously fake credentials.
"**/tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.isort]
known-first-party = ["livecart_core", "livecart_api", "livecart_worker", "livecart_simulator"]

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
plugins = ["pydantic.mypy"]
# Tests are checked as strictly as the code. The src roots are on mypy_path so
# that their modules keep their import names, and explicit package bases name
# every other file after its path, so that two members can both hold a
# tests/unit/test_main.py or a conftest.py.
mypy_path = [
    "packages/livecart-core/src",
    "services/api/src",
    "services/worker/src",
    "services/simulator/src",
]
explicit_package_bases = true
files = [
    "conftest.py",
    "packages/livecart-core/src",
    "packages/livecart-core/tests",
    "services/api/src",
    "services/api/scripts",
    "services/api/tests",
    "services/worker/src",
    "services/worker/tests",
    "services/simulator/src",
    "services/simulator/tests",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Native TOML configuration (pytest 9).
[tool.pytest]
minversion = "9.0"
testpaths = [
    "packages/livecart-core/tests",
    "services/api/tests",
    "services/worker/tests",
    "services/simulator/tests",
]
# importlib mode lets every member keep plain tests/ folders without
# __init__.py files and without module name clashes.
addopts = ["--import-mode=importlib", "-ra"]
strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the compose PostgreSQL and Redis (docker compose up -d --wait postgres redis); deselect with -m 'not integration'",
]

# `pytest --cov` (make test, CI) gates the branch coverage of the domain and
# application layers, the pure code the requirements hold to 80 %: every module
# of both packages is measured, imported by a test or not. The adapters and the
# entry points are proven by their integration tests instead.
[tool.coverage.run]
branch = true
source = ["livecart_core.domain", "livecart_core.application"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
