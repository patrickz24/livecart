# Virtual uv workspace root: not a package itself. It groups the Python
# members under a single uv.lock and holds the shared tool configuration.

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.uv]
required-version = ">=0.12.19,<0.13"

[tool.uv.workspace]
# The simulator (services/simulator) joins in milestone 4a.
members = [
    "packages/livecart-core",
    "services/api",
    "services/worker",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "S",     # flake8-bandit: security (includes S608, SQL built from strings)
    "ASYNC", # flake8-async: blocking calls inside coroutines
    "DTZ",   # flake8-datetimez: naive datetimes (timestamps are UTC-aware)
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "PT",    # flake8-pytest-style
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Tests assert and use obviously fake credentials.
"**/tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.isort]
known-first-party = ["livecart_core", "livecart_api", "livecart_worker"]

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
plugins = ["pydantic.mypy"]
files = [
    "packages/livecart-core/src",
    "services/api/src",
    "services/worker/src",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Native TOML configuration (pytest 9).
[tool.pytest]
minversion = "9.0"
testpaths = ["packages/livecart-core/tests", "services/api/tests"]
# importlib mode lets every member keep plain tests/ folders without
# __init__.py files and without module name clashes.
addopts = ["--import-mode=importlib", "-ra"]
strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["livecart_core", "livecart_api", "livecart_worker"]

[tool.coverage.report]
show_missing = true
skip_empty = true
